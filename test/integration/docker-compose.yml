# Docker Compose stack for integration tests (Qdrant + any future services).
# QDRANT_GRPC_PORT = host port for gRPC (6334); QDRANT_HTTP_PORT = host port for REST (6333, used for /readyz).
# Defaults avoid conflicts when multiple compose projects run.

services:
  qdrant:
    image: qdrant/qdrant:v1.11.4
    ports:
      - "${QDRANT_GRPC_PORT:-6334}:6334"   # gRPC (client uses this)
      - "${QDRANT_HTTP_PORT:-6333}:6333"  # REST (for /readyz health wait)
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "-", "http://localhost:6333/readyz"]
      interval: 2s
      timeout: 5s
      retries: 10
